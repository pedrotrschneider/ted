name: TED checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: npm test --prefix web
      - run: npm run build --prefix web
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [behavior, race, vet]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ted-test-only
          POSTGRES_DB: ted_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ted_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TED_TEST_DATABASE_URL: postgres://postgres:ted-test-only@localhost:5432/ted_test?sslmode=disable
      TED_REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test check prerequisites
        run: python3 -m unittest discover -s scripts -p test_check.py
      - name: Install media tools
        if: matrix.mode != 'vet'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version
      - run: bash scripts/check.sh "${{ matrix.mode }}"
