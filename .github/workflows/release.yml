name: TED image releases
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
# One release train across both branches. PR builds have independent groups.
concurrency:
  group: releases-${{ github.event_name == 'pull_request' && github.run_id || 'publish' }}
  cancel-in-progress: false
  queue: max
jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      core: ${{ steps.version.outputs.core }}
      major: ${{ steps.version.outputs.major }}
      tag: ${{ steps.version.outputs.tag }}
      build_number: ${{ steps.version.outputs.build_number }}
      publish: ${{ steps.version.outputs.publish }}
      promote: ${{ steps.version.outputs.promote }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: ${{ github.event_name == 'push' }}
      - run: python3 -m unittest discover -s scripts -p test_release_version.py
      - id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/release_version.py
  checks:
    uses: ./.github/workflows/checks.yml
  image:
    needs: [version, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: needs.version.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve an already published image on rerun
        id: existing
        if: needs.version.outputs.publish == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
        shell: bash
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /tmp/manifest.txt 2>/tmp/manifest-error.txt; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -qiE 'not found|manifest unknown|name unknown' /tmp/manifest-error.txt; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest-error.txt >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        if: steps.existing.outputs.exists != 'true'
        with:
          context: .
          build-args: RELEASE_VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.version.outputs.publish == 'true' }}
          outputs: ${{ needs.version.outputs.publish != 'true' && 'type=oci,dest=/tmp/ted-image.tar' || '' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.promote == 'true' && format('{0}:{1}', steps.image.outputs.name, github.ref_name == 'main' && 'latest' || 'develop') || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.publish != 'true'
        with:
          name: ted-${{ needs.version.outputs.version }}-oci
          path: /tmp/ted-image.tar
          compression-level: 0
          retention-days: 7
